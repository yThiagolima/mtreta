<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Estoque do Thiago — Gestão de estoque, vendas e lucros</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast-container"></div>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">ET</div>
        <div><strong>ESTOQUE DO THIAGO</strong><span>Gestão & resultados</span></div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-route="dashboard"><span class="icon">⌂</span>Dashboard</button>
        <button class="nav-item" data-route="products"><span class="icon">▦</span>Produtos</button>
        <button class="nav-item" data-route="sales"><span class="icon">↗</span>Vendas</button>
        <button class="nav-item" data-route="deliveries"><span class="icon">⌁</span>Entregas</button>
        <button class="nav-item" data-route="finance"><span class="icon">R$</span>Financeiro</button>
        <button class="nav-item" data-route="reports"><span class="icon">▤</span>Relatórios</button>
        <div class="nav-label">SISTEMA</div>
        <button class="nav-item" data-route="history"><span class="icon">◷</span>Histórico</button>
        <button class="nav-item" data-route="settings"><span class="icon">⚙</span>Configurações</button>
      </nav>
      <div class="sidebar-footer">
        <div class="storage-status"><span class="status-dot"></span><span>Dados salvos neste dispositivo</span></div>
        <button class="sidebar-backup" data-action="export-backup">Exportar backup</button>
      </div>
    </aside>

    <div class="mobile-overlay" id="mobile-overlay"></div>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb"><span id="page-kicker">Visão geral</span><strong id="page-title">Dashboard</strong></div>
        <div class="top-actions">
          <div class="global-search">
            <span>⌕</span><input id="global-search" placeholder="Pesquisar produtos, SKU, marca..." autocomplete="off">
            <div id="search-results" class="search-results hidden"></div>
          </div>
          <button class="icon-btn" id="theme-toggle" title="Alternar tema">☾</button>
          <button class="avatar" title="Thiago">T</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/products.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/deliveries.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
